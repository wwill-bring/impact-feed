<body>
<!-- Iframe fallback: embed.html?feed=sports&count=4&title=Shop%20the%20story -->
<div id="w" class="bmtn-deals"></div>
<script>
  var p = new URLSearchParams(location.search), w = document.getElementById("w");
  ["feed","count","title","brand","shuffle"].forEach(function (k) { if (p.has(k)) w.setAttribute("data-" + k, p.get(k)); });
</script>
<script src="widget.js"></script>
</body>
