<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Product picks</title>
<style>
html,body{margin:0;padding:0 2px;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
/* Inside an iframe the height is fixed, so show one row of products that fits the width:
   as many cards as fit across (at least 2), each up to 240px wide. No scrolling in either direction. */
html,body{overflow:hidden}
.bmtn-deals{margin:0 !important}
.bmtn-deals .bmtn-deals__grid{display:grid !important;grid-template-columns:repeat(var(--cols,4),minmax(0,240px)) !important;gap:14px}
.bmtn-deals .bmtn-deals__card.is-hidden{display:none !important}
.bmtn-deals .bmtn-deals__brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmtn-deals .bmtn-deals__name{min-height:3.9em}
@media (max-width:480px){.bmtn-deals .bmtn-deals__grid{gap:10px}}
</style>
</head>
<body>
<!-- Iframe fallback: embed.html?feed=sports&count=4&title=Shop%20the%20story -->
<div id="w" class="bmtn-deals"></div>
<script>
  var p = new URLSearchParams(location.search), w = document.getElementById("w");
  ["feed","count","title","brand","program","shuffle","disclosure","color"].forEach(function (k) { if (p.has(k)) w.setAttribute("data-" + k, p.get(k)); });
</script>
<script src="widget.js"></script>
<script>
  // Fit the row to the width of the story column, and refit when the window is resized.
  function fit() {
    var grid = w.querySelector(".bmtn-deals__grid");
    if (!grid) return;
    var cards = grid.querySelectorAll(".bmtn-deals__card"), gap = window.innerWidth <= 480 ? 10 : 14;
    var cols = Math.max(2, Math.min(cards.length, Math.floor((w.clientWidth + gap) / (150 + gap))));
    grid.style.setProperty("--cols", cols);
    for (var i = 0; i < cards.length; i++) cards[i].classList.toggle("is-hidden", i >= cols);
  }
  new MutationObserver(fit).observe(w, { childList: true, subtree: true });
  window.addEventListener("resize", fit);
</script>
</body>
</html>
